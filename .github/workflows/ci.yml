name: CI

on:
  push:
    branches: [main]
    paths:
      - '.tool/lingtai-kb/**'
  pull_request:
    branches: [main]
    paths:
      - '.tool/lingtai-kb/**'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
      fail-fast: false
    defaults:
      run:
        working-directory: .tool/lingtai-kb
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        run: python run_tests.py

  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .tool/lingtai-kb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install ruff
        run: pip install ruff
      - name: Lint with ruff
        run: ruff check . --select E,F,W --ignore E501,E402,W503,E402,F401,F841
