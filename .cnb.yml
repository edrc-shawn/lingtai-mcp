main:
  push:
    - imports:
        - https://cnb.cool/edrc.shawn/lingtai-data/-/blob/main/gitee-secrets.yml
      stages:
        - name: mirror to gitee
          script: |
            if [ -z "$GITEE_TOKEN" ]; then
              echo "⚠️ GITEE_TOKEN not set, skipping mirror"
              exit 0
            fi
            git remote add gitee https://erdong-risheng:${GITEE_TOKEN}@gitee.com/erdong-risheng/lingtai-mcp.git
            git push gitee main --force
